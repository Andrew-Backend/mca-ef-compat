plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.0.0'
group = 'net.mcaefcompat'
archivesBaseName = 'mca-ef-compat'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                mcaefcompat { source sourceSets.main }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'mixins.mcaefcompat.refmap.json'
    config 'mixins.mcaefcompat.json'
}

repositories {
    maven { url 'https://maven.minecraftforge.net' }
    maven { url 'https://repo.spongepowered.org/repository/maven-public/' }
    
    // 1. Указываем локальную папку libs как полноценный репозиторий
    flatDir {
        dir 'libs'
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'

    // 2. Подключаем моды через синтаксис зависимостей (без указания расширения .jar)
    // Формат: имя_файла_до_версии : версия
    implementation fg.deobf('blank:minecraft-comes-alive:7.6.26+1.20.1-universal')
    implementation fg.deobf('blank:epic-fight:20.14.14-mc1.20.1-forge')

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}


jar {
    manifest {
        attributes([
            'Specification-Title'     : 'mcaefcompat',
            'Specification-Vendor'    : 'mcaefcompat',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'mcaefcompat',
            'MixinConfigs'            : 'mixins.mcaefcompat.json'
        ])
    }
}
